<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Jam — May 14, 2026</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      color: #888;
      margin-bottom: 3rem;
      text-align: center;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    .game-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .game-card:hover {
      border-color: #555;
      transform: translateY(-3px);
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .game-author {
      font-size: 0.85rem;
      color: #888;
    }

    .play-label {
      margin-top: auto;
      padding-top: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    footer {
      margin-top: 4rem;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Game Jam</h1>
  <p class="subtitle">May 14, 2026 &mdash; Play the games we made!</p>

  <div class="games">

    <a class="game-card" href="bird-game/bird-game.html">
      <span class="game-title">Bird Game</span>
      <span class="game-author">by Sierts</span>
      <span class="play-label">▶ Play</span>
    </a>

    <!-- Add more game cards here, e.g.:
    <a class="game-card" href="friend-game.html">
      <span class="game-title">Friend's Game</span>
      <span class="game-author">by Friend</span>
      <span class="play-label">▶ Play</span>
    </a>
    -->

  </div>

  <footer>Game Jam &mdash; May 14, 2026</footer>

</body>
</html>
